<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд команды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --card2:#EDE8DC; --line:#DDD5C6; --line2:#CFC5B2;
  --text:#221E28; --muted:#837D8C; --muted2:#55505C;
  --plum:#5C2B51; --plum-wash:#EFE2EC; --lime:#C8FF00;
  --good:#256B3E; --good-wash:#DEEEE4;
  --warn:#D19A12; --warn-ink:#8A6410; --warn-wash:#F6EBD4;
  --crit:#A83228; --crit-wash:#F7DFDC;
  --deemph:#6E6858; --deemph-wash:#E6E1D5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;font-size:16px;line-height:1.6;padding-inline:20px;padding-block:28px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:32px;min-width:0}
h1,h2{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;margin:0;letter-spacing:.01em}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;overflow-wrap:anywhere}
.top{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--good);animation:p 2s infinite;flex:none}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
header{border-bottom:2px solid var(--plum);padding-bottom:20px}
header h1{font-size:46px;line-height:.98;margin-top:12px;color:var(--plum)}
.chain{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:14px;color:var(--muted2)}
.chain i{font-style:normal;color:var(--line2)}
.stamp{margin-top:18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--good);padding:11px 15px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.stamp b{font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.stamp span{font-size:13.5px;color:var(--muted2)}
.stamp .tick{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.now{margin-top:10px;background:var(--plum-wash);padding:11px 15px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.now b{color:var(--plum);font-weight:600}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec>h2{font-size:26px;color:var(--plum)}
.sec>p.lead{margin:0;color:var(--muted2);max-width:70ch;font-size:14.5px}
.scroll{overflow-x:auto;max-width:100%}

.hero{background:var(--card);border:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.hero .lb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
.hero .big{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:800;font-size:64px;line-height:.9;color:var(--plum)}
.hero .of{font-size:16px;color:var(--muted2)}
.hero .dl{font-size:14px;font-weight:600;color:var(--good)}
.hero .dl.flat{color:var(--muted2)}
.meter{height:12px;background:var(--good-wash);border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--good);border-radius:0 4px 4px 0}
.hero .second{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-top:14px;border-top:1px solid var(--line)}
.hero .second b{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:800;font-size:30px;line-height:1;color:var(--muted2)}
.hero .second span{font-size:14.5px;color:var(--muted2)}
.hero .note{font-size:13.5px;color:var(--muted2);background:var(--card2);padding:10px 13px}

.mx{border-collapse:separate;border-spacing:2px;font-size:14px}
.mx th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 3px 6px;text-align:center;vertical-align:bottom;min-width:92px;white-space:nowrap;line-height:1.25}
.mx th.rowh{text-align:left;padding-left:0;width:auto;min-width:150px;white-space:nowrap}
.mx td.rowh{background:transparent;font-size:14px;padding:0 12px 0 0;white-space:nowrap}
.mx td.rowh b{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted2);margin-right:7px}
.cl{width:92px;height:52px;text-align:center;vertical-align:middle;border:1px solid transparent;padding:2px}
.cl .g{font-size:15px;line-height:1.1;display:block}
.cl .t{font-size:10.5px;line-height:1.2;display:block;margin-top:1px}
.cl.proshlo{background:var(--good-wash);color:var(--good)}
.cl.kasanie{background:var(--good-wash);color:var(--good);border-color:var(--plum);border-style:dashed}
.cl.peredelka{background:var(--warn-wash);color:var(--warn-ink)}
.cl.idet{background:var(--plum-wash);color:var(--plum);border-color:var(--plum)}
.cl.idet .g{display:inline-flex;align-items:center;gap:5px}
.cl.vstalo{background:var(--crit-wash);color:var(--crit);border-color:var(--crit)}
.cl.granica{background:var(--deemph-wash);color:var(--deemph)}
.cl.net{background:transparent;border:1px dashed var(--line2);color:var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;font-size:13.5px;color:var(--muted2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{font-style:normal;font-size:12px;width:30px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line)}
.tbl th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl .hot{color:var(--crit);font-weight:600}
.tbl .warm{color:var(--warn-ink);font-weight:600}
.tbl .zero{color:var(--line2)}

.quad{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:2px}
@media(max-width:700px){.quad{grid-template-columns:minmax(0,1fr)}.quad .axl,.quad .axb{display:none}}
.quad .axl{display:flex;align-items:center;justify-content:flex-end;text-align:right;padding-right:10px;font-size:12px;color:var(--muted);line-height:1.3}
.quad .axb{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.qc{background:var(--card);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.qc h4{margin:0;font-size:15px;font-weight:600}
.qc p{margin:0;font-size:13.5px;color:var(--muted2)}
.qc.here{background:var(--lime);border-color:transparent}
.qc.here p{color:#3A3A28}
.qc .badge{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--plum);align-self:flex-start;background:var(--card);padding:2px 8px}
.qbase{background:var(--card);border:1px solid var(--line);padding:12px 15px;font-size:13.5px;color:var(--muted2)}
.qbase b{color:var(--text);font-weight:600}

.dim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px dashed var(--line2)}
@media(max-width:700px){.dim{grid-template-columns:minmax(0,1fr)}}
.dim>div{background:var(--card2);padding:14px 16px;opacity:.75}
.dim span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dim b{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:800;font-size:26px;line-height:1;display:block;margin-top:5px;color:var(--muted)}
.dim i{font-style:normal;font-size:12.5px;color:var(--muted2);display:block;margin-top:4px}

.next{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.next>div{background:var(--card);padding:14px 16px;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.next b{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:800;font-size:26px;line-height:1;color:var(--plum)}
details.tv summary{cursor:pointer;color:var(--plum);font-weight:600;font-size:13.5px}
details.tv table{margin-top:10px}
.empty{background:var(--card);border:1px dashed var(--line2);padding:20px;color:var(--muted2);text-align:center}
footer{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
</style></head><body>
<main class="wrap" id="root"></main>
<script type="application/json" id="dannye">null</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('dannye').textContent);
const root=document.getElementById('root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!D){root.innerHTML='<header><h1>Дашборд команды</h1><p>Данные пока не загружены. Здесь нет учебных результатов.</p></header>';}
else {
 const A=D.attempts||[], total=A.length, done=A.filter(a=>a.complete).length, free=A.filter(a=>a.no_hands).length;
 const labels={trial:'Пробные',baseline:'Первая серия',repeat:'Повтор',other:'Другие'};
 const state={net:'нет событий',idet:'в работе',vstalo:'остановка',proshlo:'готово'};
 const list=xs=>xs.length?'<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>Нет.</p>';
 let h='<header><div class="top">AI КОМАНДА · факты по журналу</div><h1>'+esc(D.title)+'</h1><div class="chain">'+D.steps.map(esc).join(' → ')+'</div><div class="stamp"><b>'+(D.live?'Обновление после шагов':'Снимок')+'</b><span>'+esc(D.updated)+'</span></div><p>'+esc(D.mode)+' · источник: '+esc(D.source)+'</p></header>';
 h+='<section class="sec"><h2>Дошло или нет</h2><div class="hero"><div class="lb">Подтверждённо без рук внутри выбранного участка</div><div class="row"><b class="big">'+free+'</b><span class="of">из '+total+' зарегистрированных попыток</span></div><div class="second"><b>'+done+'</b><span>дошло до конца, включая работу с человеком</span></div><div class="note">Дела и попытки не одно и то же. При неизвестном учёте касаний успех без рук не подтверждён. Первичный запуск и просмотр результата после участка не считаются касанием.</div></div></section>';
 h+='<section class="sec"><h2>Две серии на тех же входах</h2><div class="scroll"><table class="mx"><thead><tr><th>Серия</th><th>Зарегистрировано</th><th>Наблюдение закончено</th><th>Дошло</th><th>Без рук</th></tr></thead><tbody>';
 for(const [key,s] of Object.entries(D.series||{})) h+='<tr><td>'+esc(labels[key]||key)+'</td><td>'+s.total+'</td><td>'+s.observed+'</td><td>'+s.complete+'</td><td>'+s.no_hands+'</td></tr>';
 h+='</tbody></table></div><p>'+(D.comparison?.comparable?'Изменение числа без рук: '+(D.comparison.delta>0?'+':'')+D.comparison.delta+'. Это наблюдение на этой выборке, не доказательство надёжности.':'Сравнение пока недоступно: нужны одинаковые дела, входы и участок, законченные наблюдения и известные касания в обеих сериях.')+'</p></section>';
 h+='<section class="sec"><h2>Путь дел по шагам</h2><div class="scroll"><table class="mx"><thead><tr><th class="rowh">Дело / попытка</th>'+D.steps.map(s=>'<th>'+esc(s)+'</th>').join('')+'<th>Касания</th><th>Итог</th></tr></thead><tbody>';
 for(const a of A){h+='<tr><td class="rowh"><b>'+esc(a.case)+'</b>'+esc(a.id)+(a.synthetic===true?' · учебное':'')+'</td>';for(const c of a.cells){h+='<td class="cl '+(Object.hasOwn(state,c.state)?c.state:'net')+'"><span class="g">'+esc(state[c.state]||'неизвестно')+'</span><span class="t">'+(c.touches?'руки: '+c.touches+' ':'')+(c.reworks?'переделки: '+c.reworks:'')+'</span></td>';}h+='<td>'+a.touches+(a.touches_known?'':' + неизвестно')+'</td><td>'+(a.uncertain?'неопределённо':a.no_hands?'без рук':a.complete?'дошло':a.observed?'остановилось':'не закончено')+'</td></tr>';}
 h+='</tbody></table></div>'+(!A.length?'<p>Пока нет зарегистрированных попыток. Это нулевой снимок, не замер «было».</p>':'')+'</section>';
 h+='<section class="sec"><h2>Отказы и приёмка</h2><p>По данным: '+A.reduce((s,a)=>s+a.data_errors,0)+'. По инструментам: '+A.reduce((s,a)=>s+a.tool_errors,0)+'.</p><p>Последняя приёмка: принято '+A.filter(a=>a.acceptance==='принято').length+', поправил '+A.filter(a=>a.acceptance==='поправил').length+', отклонил '+A.filter(a=>a.acceptance==='отклонил').length+'. Нет записи '+A.filter(a=>!a.acceptance).length+'.</p><p>Файл и запись не доказывают качество содержания. Критерии проверяет роль или человек.</p></section>';
 h+='<section class="sec"><h2>Что пока неизвестно</h2>'+list([...(D.warnings||[]),...A.flatMap(a=>a.problems.map(p=>a.id+': '+p)),...A.filter(a=>!a.touches_known).map(a=>a.id+': учёт ручных действий не подтверждён'),...(D.cases_without_journal||[]).map(c=>'Дело '+c+': нет журнала')])+'</section>';
 h+='<section class="sec"><h2>Что дальше</h2><p>Разбери с механиком одно место по конкретным строкам журнала. Сохрани первую серию, внеси согласованное исправление и повтори те же входы в новых попытках.</p><p>Ручное согласование может быть нужной границей. Отказ может быть правильной остановкой. По цвету клетки причину не назначаем.</p></section>';
 root.innerHTML=h;
 if(D.live) setTimeout(()=>location.reload(),60000);
}
</script>
</body></html>
